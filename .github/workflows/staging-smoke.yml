name: Staging smoke (local replica)
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run check:platform-isolation
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: npm run smoke:local
      - run: npm run backup:restore:local
