[[entry]]
id = 1
type = "story"
title = "Traçar evento sintético até reserva de orçamento em produção"
description = "Depois que os sócios aprovarem e registrarem provedor, hospedagem/região/termos, persistência/fila/migrações, limites por categoria e regra de liberação, provisiona ambiente seguro sintético e percorre evento durável da aplicação Next.js pelo outbox e worker até a porta mínima de reserva Budget."
verify = "App e worker respondem por HTTPS com segredos restritos; repetir o evento sintético produz um job e uma reserva, hosting fica contabilizado no limite aprovado e nenhum dado pessoal ou tráfego real de WhatsApp entra no fluxo."
covers = ["CAP-7"]
after = []
hitl = true
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-3", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-6", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-8"]

[[entry]]
id = 2
type = "story"
title = "Endurecer CI e controles da plataforma de produção"
description = "Estabelece CI para build e empacotamento da aplicação e worker, promoção com aprovação humana, ambientes e segredos separados, banco e mídia privados, cache sem conteúdo pessoal e restauração de backup usando somente fixture sintética."
verify = "CI publica artefatos versionados e exige aprovação para promoção, controles de isolamento passam e uma restauração sintética pode ser concluída sem expor dados pessoais."
covers = ["CAP-7"]
after = [1]
hitl = false
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-1", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-8"]

[[entry]]
id = 3
type = "story"
title = "Definir contratos públicos e fixtures dos módulos"
description = "Define schemas de eventos/outbox, portas públicas e fixtures para os módulos consumidores, estendendo o tracer sem permitir escrita direta em dados de outro domínio."
verify = "Fixtures de consumidores exercitam schema e casos públicos de Budget e os contratos são compatíveis entre aplicação e worker."
covers = ["CAP-7"]
after = [1, 2]
hitl = false
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-1", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-3"]

[[entry]]
id = 4
type = "story"
title = "Registrar custos e reservar o teto com segurança"
description = "Implementa livro razão de custos realizados, comprometidos, reservados, não faturados e externos com chave estável, reserva atômica/idempotente, teto de R$ 500, limites aprovados por categoria, tentativas limitadas e bloqueio fail-closed para estado desconhecido ou insuficiente."
verify = "Repetição e concorrência não duplicam reservas, e estados desconhecidos ou insuficientes bloqueiam qualquer nova autorização acima dos limites."
covers = ["CAP-7"]
after = [1, 2, 3]
hitl = false
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-6"]

[[entry]]
id = 5
type = "story"
title = "Conciliar custos e liquidar ou liberar reservas"
description = "Concilia custos confirmados, pendentes, externos e não faturados e permite apenas liquidação ou liberação autorizada, auditada e idempotente sem presumir que valores desconhecidos já foram cobrados ou podem ser liberados."
verify = "Reconciliações repetidas convergem sem dupla contabilização, e uma reserva não é liberada sem decisão autorizada e evidência terminal."
covers = ["CAP-7"]
after = [4]
hitl = false
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-6"]

[[entry]]
id = 6
type = "story"
title = "Expor snapshot de orçamento para Operações"
description = "Fornece caso público somente leitura com saldos disponíveis, comprometidos, reservados e não faturados, bloqueios e seus motivos para a superfície de Operações."
verify = "Um consumidor de Operações lê snapshot consistente e motivo de bloqueio sem alterar o livro razão."
covers = ["CAP-7"]
after = [5]
hitl = false
risk = "medium"
references = ["../ux-ensaios-ia-whatsapp/EXPERIENCE.md#visao-operacional"]

[[entry]]
id = 7
type = "story"
title = "Monitorar bloqueios e recuperar trabalho de orçamento"
description = "Emite eventos duráveis e acionáveis para jobs e reconciliações paradas, estados desconhecidos e limites insuficientes, oferecendo recuperação idempotente sem auto-liberação nem interface de operador."
verify = "Um consumidor de Operações recebe e resolve um evento de recuperação sem criar reserva duplicada ou liberar custo automaticamente."
covers = ["CAP-7"]
after = [4, 5, 6]
hitl = false
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-3", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-6"]

[[entry]]
id = 8
type = "story"
title = "Refactor sweep da base e do orçamento"
description = "Resolve apenas a dívida estrutural e achados de revisão adiados pelas histórias concluídas, preservando contratos, trilha de auditoria e bloqueios do orçamento."
verify = "A revisão final confirma que os contratos públicos e as verificações da base permanecem válidos após a limpeza."
covers = ["CAP-7"]
after = [1, 2, 3, 4, 5, 6, 7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Executar suíte fim a fim da base e do orçamento"
description = "Verifica o caminho implantado da aplicação e worker pelo evento durável até Budget, incluindo idempotência, concorrência, limites, reconciliação, snapshot e recuperação com dados sintéticos."
verify = "A suíte comprova o tracer em produção e os cenários de duplicata, concorrência, estado desconhecido/insuficiente, bloqueio, reconciliação, leitura do snapshot e fixture sem ação real de cliente, Pix, IA ou foto."
covers = ["CAP-7"]
after = [8]
hitl = false
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-3", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-6", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-8"]
