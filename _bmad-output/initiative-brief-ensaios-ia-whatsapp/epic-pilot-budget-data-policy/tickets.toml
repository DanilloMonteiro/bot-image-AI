type = "story"
title = "Fornecer snapshot de orçamento para Operações"
description = "Expõe um contrato somente leitura com saldos realizados, comprometidos, reservados e não faturados, custos conciliados, bloqueios e seus motivos, alertas em 60/80/95% do total e das categorias e margem com hipóteses claramente identificadas; a interface geral continua no Epic de Operações."
verify = "Um consumidor sintético de Operações lê um snapshot consistente com estados financeiros, limiares, motivos de bloqueio e hipóteses de margem sem alterar o ledger."
covers = ["CAP-7"]
