[[entry]]
id = 1
type = "story"
title = "Percorrer o tracer sintético até uma reserva Budget"
description = "Reutiliza a aplicação, o worker e o fluxo durável do Epic 1 para percorrer um evento sintético até uma reserva mínima de Budget por uma porta provisória; não reimplementa CI ou infraestrutura nem habilita tráfego de cliente, WhatsApp real ou fotos."
verify = "No ambiente de produção sintético, repetir o mesmo evento cria um único job durável e uma única reserva mínima, sem acessar rotas de cliente ou mídia."
covers = ["CAP-7"]
after = ["1.6"]
hitl = true
risk = "high"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-3", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-6", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-8"]

[[entry]]
id = 2
type = "story"
title = "Aprovar e versionar a política de dados"
description = "Registra uma política aprovada e versionada por tipo de dado e fornecedor, com finalidade, acesso, região e transferência, retenção, exclusão e exceções; expõe um contrato consumível e um gate fechado por padrão. Epic 3 apresenta a política e coleta consentimento; Epic 6 revalida a política antes do processamento de imagens."
verify = "Fixtures sintéticas comprovam que consumidores obtêm a versão aprovada e que política ausente, incompleta ou não aprovada bloqueia coleta e processamento."
