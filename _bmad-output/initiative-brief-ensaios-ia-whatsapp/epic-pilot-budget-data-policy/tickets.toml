[[entry]]
id = 1
type = "story"
title = "Percorrer o tracer sintético até uma reserva Budget"
description = "Reutiliza a aplicação, o worker e o fluxo durável já entregues pela story 1.6 para percorrer um evento sintético até uma reserva mínima de Budget por uma porta provisória; não reimplementa CI ou infraestrutura nem habilita tráfego de cliente, WhatsApp real ou fotos."
verify = "No ambiente de produção sintético, repetir o mesmo evento cria um único job durável e uma única reserva mínima, sem acessar rotas de cliente ou mídia."
covers = ["CAP-7"]
hitl = true
risk = "high"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-3", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-6", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-8"]
notes = ["Acesso ao workspace e aplicação web/worker em produção confirmados em 2026-10-23; a story 1.6 já entregou a infraestrutura consumida por este tracer. A validação usa somente dados sintéticos. A reconciliação de custo e os gates de cliente/foto seguem pendentes, sem bloquear o desenvolvimento do Epic 2."]

[[entry]]
id = 2
type = "story"
title = "Aprovar e versionar a política de dados"
description = "Registra a política v2 aprovada e versionada, com Meta WhatsApp Cloud API direta, dados sob controle da aplicação, finalidade, acesso, retenção, exclusão e exceções. O gate operacional da Data Policy exige exclusão local verificada; região e cópias externas seguem informativas e não são gates. Epic 3 apresenta a política e coleta consentimento; Epic 6 revalida política, consentimento e exclusão local antes do processamento de imagens."
verify = "Fixtures sintéticas comprovam que consumidores obtêm v2, v1 não substitui a versão corrente, e política ausente, incompleta, não aprovada ou com exclusão local pendente bloqueia coleta/processamento sem chamada de provedor."
covers = ["CAP-2"]
after = []
hitl = true
risk = "high"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-5", "../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-7", "../ux-ensaios-ia-whatsapp/EXPERIENCE.md"]
notes = ["Decisão do proprietário em 2026-10-25: AbacatePay para Pix; Google Vertex AI Gemini 3.8 Flash em multi-região dos EUA para conversa; Nano Banana 2.1 em endpoint global para imagens. Seguir os padrões das ferramentas selecionadas; cópias/retenção externa e processamento global não são gates da política. Usar serviço pago; não autorizar treinamento, publicidade ou portfólio sem consentimento separado. Validar compreensão de mensagens ambíguas de pessoas idosas com exemplos sintéticos.", "Reter fotos originais e resultados por até 7 dias após entrega para suporte e avaliação no painel, acessíveis somente aos dois sócios administradores; conversa completa e prova mínima de consentimento por até 7 dias após encerramento. Expurgar no primeiro processamento possível depois dos prazos; a aplicação/worker deve apagar objetos porque Railway Bucket não oferece lifecycle. AbacatePay e parceiros podem reter registros de transação por períodos legais/regulatórios.", "Manter o backup PostgreSQL Railway existente: pg_dump a cada 3 dias, retenção de 6 dias, sem mudar tecnologia ou configuração. Dumps já gerados podem conservar conversa/prova de consentimento depois da exclusão ativa até expirarem. A política v2 continua bloqueando dados reais até a exclusão local sob controle da aplicação estar implementada e comprovada; região e cópias externas não são gates da política.", "Decisão do proprietário em 2026-10-25: incluir a Plataforma WhatsApp Business oficial/Meta na política como provedora do canal e informar o tratamento/cópias segundo os termos vigentes; registrar também qualquer intermediário/BSP que venha a ser usado. Após pesquisa de candidatos solicitada pelo proprietário em 2026-10-27, adotou-se a recomendação de WhatsApp Cloud API diretamente pela Meta, sem BSP no piloto; região e cópias Meta/Google não são gates da política e a exclusão local ainda precisa ser comprovada."]

