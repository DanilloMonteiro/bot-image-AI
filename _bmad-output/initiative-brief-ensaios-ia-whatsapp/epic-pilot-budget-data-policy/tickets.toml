[[entry]]
id = 1
type = "story"
title = "Conectar tracer sintético local à reserva Budget"
description = "Define o contrato público mínimo de reserva Budget e conecta um evento sintético pelo caminho durável local de app, outbox e worker a uma reserva idempotente, sem escrita direta em dados de outro módulo; a história 2.3 amplia esse contrato para o ledger autoritativo e suas garantias completas."
verify = "No ambiente local, repetir o evento sintético conclui um job e deixa uma única reserva durável consultável por correlação, sem tráfego externo ou dado pessoal; o aceite desta história cobre o contrato mínimo, e o ledger completo e a concorrência ficam em 2.3."
covers = ["CAP-7"]
after = ["1.1", "1.2"]
hitl = false
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md"]

[[entry]]
id = 2
type = "story"
title = "Registrar inventário e aprovar política de dados"
description = "Consolida provedores, regiões, tipos de dado, finalidade, acesso, retenção, exclusão, cópias/backups e exceções em uma política versionada para aprovação humana antes de qualquer coleta real."
verify = "A versão aprovada identifica cada tratamento e fornecedor, registra as decisões de retenção/exclusão e mantém o gate de dados reais fechado enquanto faltar informação ou aprovação."
covers = ["CAP-2"]
after = []
hitl = true
risk = "high"
unknown = "Definir prazos e exceções por tipo de dado, validar transferência internacional/criptografia/cópias com os termos e configurações efetivos do provedor, e registrar a aprovação responsável; não processar fotos reais antes disso."
notes = ["Verificação externa: conferir termos e configurações efetivas dos provedores, regiões, criptografia, cópias/backups e evidência de retenção/exclusão; obter aprovação humana registrada antes de liberar dados reais."]
references = ["../spec-ensaios-ia-whatsapp/spec-ensaios-ia-whatsapp.md", "../prd-ensaios-ia-whatsapp/prd-ensaios-ia-whatsapp.md", "../prd-ensaios-ia-whatsapp/addendum.md"]

[[entry]]
id = 3
type = "story"
title = "Registrar custos e reservar o teto com segurança"
description = "Amplia o contrato mínimo introduzido em 2.1 para o ledger autoritativo de custos realizados, comprometidos, reservados, não faturados e externos, com chave estável, reserva atômica/idempotente, teto de R$500, limites aprovados por categoria e bloqueio fail-closed."
verify = "Repetição e concorrência não duplicam reservas, e custo/saldo desconhecido ou insuficiente bloqueia toda nova autorização acima dos limites."
covers = ["CAP-7"]
after = [1]
hitl = false
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md"]

[[entry]]
id = 4
type = "story"
title = "Conciliar custos e liquidar ou liberar reservas"
description = "Concilia custos confirmados, pendentes, externos e não faturados e permite somente liquidação ou liberação autorizada, auditada e idempotente, sem presumir que valores desconhecidos já foram cobrados ou podem ser liberados."
verify = "Reconciliações repetidas convergem sem dupla contabilização, e nenhuma reserva é liberada sem decisão autorizada e evidência terminal."
covers = ["CAP-7"]
after = [3]
hitl = false
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md"]

[[entry]]
id = 5
type = "story"
title = "Expor snapshot de orçamento para Operações"
description = "Fornece caso público somente leitura com saldos disponíveis, comprometidos, reservados e não faturados, custos reconciliados, bloqueios e dados para a avaliação de margem por Operações."
verify = "Um consumidor de Operações lê snapshot somente leitura com valores realizados, comprometidos, reservados, não faturados e reconciliados, saldo disponível por categoria e total, motivo do bloqueio e horário da última reconciliação, sem alterar o ledger; preços permanecem identificados como provisórios."
covers = ["CAP-7"]
after = [4]
hitl = false
risk = "medium"
references = ["../ux-ensaios-ia-whatsapp/EXPERIENCE.md"]

[[entry]]
id = 6
type = "story"
title = "Monitorar bloqueios, alertas e recuperação do orçamento"
description = "Emite eventos duráveis e acionáveis para jobs e reconciliações paradas, estados desconhecidos e limites insuficientes, alerta em 60/80/95% do teto total e por categoria, e recupera trabalho sem auto-liberação nem interface de operador."
verify = "Ao cruzar cada limiar ou simular estado desconhecido, um consumidor recebe o alerta correto sem duplicata e pode recuperar o trabalho sem criar reserva repetida ou liberar custo."
covers = ["CAP-7"]
after = [3, 4, 5]
hitl = false
risk = "medium"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md"]

[[entry]]
id = 7
type = "story"
title = "Traçar evento sintético até reserva Budget em produção"
description = "Após a entrega 1.6 e a conexão autorizada do workspace Railway, percorre evento sintético durável da aplicação e worker até a reserva Budget e registra o custo estimado de hospedagem pelo contrato/ledger de 2.3. Não executa conciliação de fatura, que pertence a 2.4."
verify = "App e worker respondem por HTTPS, repetir o evento gera um job e uma reserva, hospedagem entra no limite aprovado e nenhum dado pessoal ou tráfego real de WhatsApp é usado."
covers = ["CAP-7"]
after = ["1.6", 1, 3]
hitl = true
risk = "high"
unknown = "O workspace Railway não está conectado; aguardar acesso e autorização explícita para validar recursos e configurações de produção."
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md"]
notes = ["Verificação externa: validar acesso e configuração do workspace Railway, HTTPS, execução do app/worker, uso sintético e custo estimado configurado; manter dados pessoais e tráfego real desativados."]

[[entry]]
id = 8
type = "story"
title = "Refactor sweep da base e do orçamento"
description = "Resolve apenas a dívida estrutural e achados de revisão adiados pelas histórias concluídas, preservando contratos, trilha de auditoria e bloqueios do orçamento."
verify = "A revisão final confirma que os contratos públicos e as verificações da base permanecem válidos após a limpeza."
covers = ["CAP-7", "CAP-2"]
after = [1, 2, 3, 4, 5, 6, 7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Executar suíte fim a fim da base e do orçamento"
description = "Verifica a integração implantada da aplicação e worker pelo evento durável até Budget, incluindo idempotência, concorrência, limites, reconciliação, snapshot e recuperação com dados sintéticos."
verify = "A suíte comprova o tracer sintético de produção e os cenários de duplicata, concorrência, estado desconhecido/insuficiente, bloqueio, alertas, reconciliação, snapshot e gate sem ação real de cliente, Pix, IA ou foto."
covers = ["CAP-7", "CAP-2"]
after = [8]
hitl = false
