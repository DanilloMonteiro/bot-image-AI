[[entry]]
id = 4
type = "story"
title = "Expandir a reserva para o ledger e os limites do piloto"
description = "Amplia a reserva mínima do tracer para registrar custos incorridos, comprometidos, reservados e não faturados, incluindo anúncios, operação e custos externos, com chave estável, atomicidade, idempotência e tentativas limitadas. Aplica o teto total de R$500 e os limites aprovados: R$220 anúncios, R$110 IA, R$65 Railway, R$25 domínio/acessórios e R$80 Meta/Pix/câmbio/retentativas; saldo ou custo desconhecido ou insuficiente falha fechado."
verify = "Uma integração com eventos sintéticos concorrentes confirma os quatro estados financeiros, os limites total e por categoria, a idempotência das reservas e o bloqueio para saldo ou custo desconhecido ou insuficiente."
covers = ["CAP-7"]
after = [1, 3]
hitl = false
risk = "high"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-6", "../spec-ensaios-ia-whatsapp/spec-ensaios-ia-whatsapp.md"]

[[entry]]
id = 5
type = "story"
title = "Conciliar custos e liquidar ou liberar reservas"
description = "Concilia custos confirmados, pendentes, externos e não faturados; permite liquidação ou liberação idempotente somente após estado terminal, conciliação e decisão de administrador autorizado, registrando ator, motivo e horário sem tratar valores desconhecidos como pagos ou liberáveis."
verify = "Repetir uma conciliação sintética converge sem dupla contabilização e uma reserva só é liberada após autorização de administrador e evidência terminal conciliada."
covers = ["CAP-7"]
after = [4]
hitl = true
risk = "high"
references = ["../architecture-ensaios-ia-whatsapp/architecture-ensaios-ia-whatsapp.md#ad-6"]

[[entry]]
