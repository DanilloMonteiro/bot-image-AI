title = "Integrar conversa do WhatsApp a pedidos e Pix em sandbox"
description = "Conecta os casos públicos de Conversas e Pedidos/Pagamentos e percorre no WhatsApp de teste uma compra paga pelo Dev mode da AbacatePay, sem Pix ou foto de produção."
