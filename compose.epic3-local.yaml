services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-epic3_test}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env.epic3.local}
      POSTGRES_DB: ${DATABASE_NAME:-epic3_test}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-54433}:5432"
    volumes:
      - epic3_local_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-epic3_test} -d ${DATABASE_NAME:-epic3_test}"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [private]

volumes:
  epic3_local_postgres:

networks:
  private: {}
