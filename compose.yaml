services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: smoke
    volumes:
      - smoke_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoke -d smoke"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [private]
  web:
    build: .
    command: npm run start:web
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: smoke
      DATABASE_USER: smoke
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      STAGING_SMOKE_SECRET: ${STAGING_SMOKE_SECRET:?set STAGING_SMOKE_SECRET}
      STAGING_SMOKE_TEST_MODE: ${STAGING_SMOKE_TEST_MODE:-0}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db: { condition: service_healthy }
    networks: [private]
  worker:
    build: .
    command: npm run start:worker
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: smoke
      DATABASE_USER: smoke
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      STAGING_SMOKE_TEST_MODE: ${STAGING_SMOKE_TEST_MODE:-0}
      STAGING_SMOKE_TEST_FAIL_UNTIL_ATTEMPT: ${STAGING_SMOKE_TEST_FAIL_UNTIL_ATTEMPT:-0}
      STAGING_SMOKE_TEST_CRASH_AFTER_COMMIT: ${STAGING_SMOKE_TEST_CRASH_AFTER_COMMIT:-0}
    depends_on:
      db: { condition: service_healthy }
    restart: on-failure
    networks: [private]
volumes:
  smoke_postgres:
networks:
  private: {}
